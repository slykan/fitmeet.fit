<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; background: #05070f; }
  .c { position: relative; width: 1200px; height: 675px; overflow: hidden; font-family: "Segoe UI", Arial, sans-serif;
       background: radial-gradient(900px 520px at 70% 45%, #10204a 0%, #0b1020 45%, #05070f 100%); }
  .mreza { position: absolute; inset: 0; opacity: .14;
       background-image: linear-gradient(#2a4cff 1px, transparent 1px), linear-gradient(90deg, #2a4cff 1px, transparent 1px);
       background-size: 60px 60px; mask-image: radial-gradient(700px 400px at 70% 50%, #000, transparent); }
  svg.ilu { position: absolute; left: 560px; top: 30px; width: 600px; height: 576px; }
  .znak { position: absolute; left: 56px; top: 48px; width: 120px; height: 120px; border-radius: 50%;
       background: url("../fitmeet-web/public/logo_full.png") center 23.5% / 340px auto no-repeat; }
  .rijec { position: absolute; left: 60px; bottom: 120px; font-size: 92px; letter-spacing: 10px; font-weight: 300; line-height: 1; }
  .rijec b { color: #6cff2f; font-weight: 300; } .rijec span { color: #fff; }
  .slogan { position: absolute; left: 64px; bottom: 74px; font-size: 22px; letter-spacing: 7px; font-weight: 600; }
  .slogan b { color: #6cff2f; font-weight: 600; } .slogan span { color: #2b9dff; }
  .oznaka { position: absolute; left: 60px; top: 205px; padding: 10px 22px; border: 2px solid #6cff2f; border-radius: 40px; color: #6cff2f;
       font-size: 26px; letter-spacing: 6px; font-weight: 700; text-transform: uppercase; box-shadow: 0 0 22px rgba(108,255,47,.35), inset 0 0 14px rgba(108,255,47,.2); }
</style></head>
<body>
<div class="c">
  <div class="mreza"></div>
  <svg class="ilu" viewBox="0 0 640 615" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6cff2f"/><stop offset="1" stop-color="#2b9dff"/></linearGradient>
      <filter id="sjaj" filterUnits="userSpaceOnUse" x="0" y="0" width="640" height="615"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    <g id="krugovi" stroke="url(#g)" stroke-width="3" opacity=".35">
      <circle cx="330" cy="300" r="270"/><circle cx="330" cy="300" r="210" stroke-dasharray="40 26"/><circle cx="330" cy="300" r="150" opacity=".6"/>
    </g>
    <g id="crtez" stroke="url(#g)" stroke-width="14" filter="url(#sjaj)"></g>
  </svg>
  <div class="znak"></div>
  <div class="oznaka" id="oznaka"></div>
  <div class="rijec"><b>FIT</b><span>MEET</span></div>
  <div class="slogan"><b>FIND YOUR PEOPLE.</b> <span>MOVE TOGETHER.</span></div>
</div>
