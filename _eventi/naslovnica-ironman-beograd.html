<!doctype html>
<html><head><meta charset="utf-8">
<!-- Naslovnica eventa IRONMAN 70.3 Belgrade 2027 (FitMeet stil, 1200x675). Snimka: Edge headless → ironman-703-beograd-2027.jpg -->
<style>
  html, body { margin: 0; background: #05070f; }
  .c { position: relative; width: 1200px; height: 675px; overflow: hidden; font-family: "Segoe UI", Arial, sans-serif; color: #fff;
       background: radial-gradient(900px 560px at 72% 40%, #12265a 0%, #0b1020 50%, #05070f 100%); }
  .mreza { position: absolute; inset: 0; opacity: .12;
       background-image: linear-gradient(#2a4cff 1px, transparent 1px), linear-gradient(90deg, #2a4cff 1px, transparent 1px);
       background-size: 60px 60px; mask-image: radial-gradient(760px 420px at 70% 45%, #000, transparent); -webkit-mask-image: radial-gradient(760px 420px at 70% 45%, #000, transparent); }
  svg.ilu { position: absolute; inset: 0; width: 1200px; height: 675px; }
  .znak { position: absolute; left: 56px; top: 44px; width: 96px; height: 96px; border-radius: 50%;
       background: url("../fitmeet-web/public/logo_full.png") center 23.5% / 272px auto no-repeat; }
  .marka { position: absolute; left: 166px; top: 70px; font-size: 34px; letter-spacing: 7px; font-weight: 300; }
  .marka b { color: #6cff2f; font-weight: 300; }
  .oznaka { position: absolute; left: 60px; top: 170px; padding: 8px 20px; border: 2px solid #6cff2f; border-radius: 40px; color: #6cff2f;
       font-size: 20px; letter-spacing: 6px; font-weight: 700; box-shadow: 0 0 22px rgba(108,255,47,.35), inset 0 0 14px rgba(108,255,47,.2); }
  h1 { position: absolute; left: 56px; top: 222px; margin: 0; font-size: 84px; line-height: .95; font-weight: 800; letter-spacing: 1px; }
  h1 .broj { color: #6cff2f; text-shadow: 0 0 26px rgba(108,255,47,.55); }
  h1 small { display: block; font-size: 58px; font-weight: 300; letter-spacing: 12px; color: #9fc6ff; margin-top: 8px; }
  .datum { position: absolute; left: 60px; top: 420px; font-size: 30px; font-weight: 700; letter-spacing: 2px; }
  .datum span { color: #2b9dff; font-weight: 500; }
  .discipline { position: absolute; left: 60px; bottom: 58px; display: flex; gap: 14px; }
  .discipline div { border: 1.5px solid rgba(159,198,255,.35); border-radius: 14px; padding: 10px 18px; background: rgba(11,16,32,.6); }
  .discipline b { display: block; font-size: 30px; color: #6cff2f; line-height: 1.05; }
  .discipline span { font-size: 15px; letter-spacing: 3px; color: #9fc6ff; text-transform: uppercase; }
</style></head>
<body>
<div class="c">
  <div class="mreza"></div>
  <svg class="ilu" viewBox="0 0 1200 675" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6cff2f"/><stop offset="1" stop-color="#2b9dff"/></linearGradient>
      <linearGradient id="voda" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2b9dff"/><stop offset="1" stop-color="#6cff2f"/></linearGradient>
      <filter id="sjaj" filterUnits="userSpaceOnUse" x="0" y="0" width="1200" height="675"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>

    <!-- Most na Adi: jedan pilon i lepeza kabela (pozadina) -->
    <g stroke="#2b9dff" stroke-width="2.4" opacity=".38">
      <path d="M905 40 L905 330"/>
      <path d="M905 60 L640 330 M905 80 L690 330 M905 100 L740 330 M905 120 L790 330 M905 140 L840 330"/>
      <path d="M905 60 L1170 330 M905 80 L1120 330 M905 100 L1070 330 M905 120 L1020 330 M905 140 L970 330"/>
      <path d="M560 330 L1200 330" stroke-width="4"/>
    </g>

    <!-- staza koja spaja discipline (isprekidana) -->
    <path d="M600 520 C 680 470, 720 420, 800 420 S 930 470, 990 400 S 1080 300, 1150 290" stroke="url(#g)" stroke-width="3" stroke-dasharray="2 14" opacity=".9"/>

    <!-- 1. plivač u valovima (Savsko jezero) -->
    <g stroke="url(#voda)" stroke-width="9" filter="url(#sjaj)">
      <path d="M540 560 q25 -18 50 0 t50 0 t50 0 t50 0"/>
      <path d="M560 595 q25 -18 50 0 t50 0 t50 0" opacity=".7"/>
      <path d="M640 512a16 16 0 1 0 0.1 0"/>
      <path d="M626 530 L578 548"/>
      <path d="M655 520 Q690 470 720 520"/>
    </g>

    <!-- 2. biciklist -->
    <g stroke="url(#g)" stroke-width="9" filter="url(#sjaj)">
      <path d="M770 450a44 44 0 1 0 0.1 0"/><path d="M915 450a44 44 0 1 0 0.1 0"/>
      <path d="M770 450 L818 398 L890 398 L915 450 M818 398 L842 450 L890 398 M842 450 L770 450"/>
      <path d="M876 340a15 15 0 1 0 0.1 0"/>
      <path d="M866 368 L815 392 M866 368 L895 395 M815 392 L842 450"/>
    </g>

    <!-- 3. trkač prema cilju -->
    <g stroke="url(#g)" stroke-width="9" filter="url(#sjaj)">
      <path d="M1082 195a18 18 0 1 0 0.1 0"/>
      <path d="M1076 232 L1052 300"/>
      <path d="M1052 300 L1090 338 L1072 398 M1052 300 L1022 345 L978 356"/>
      <path d="M1073 242 L1112 272 L1145 258 M1070 246 L1030 258 L1008 290"/>
    </g>
    <!-- cilj -->
    <g stroke="#6cff2f" stroke-width="5" opacity=".9" filter="url(#sjaj)">
      <path d="M1135 160 L1135 300 M1185 160 L1185 300 M1135 168 L1185 168"/>
    </g>
  </svg>
  <div class="znak"></div>
  <div class="marka"><b>FIT</b>MEET</div>
  <div class="oznaka">TRIATLON · BEOGRAD</div>
  <h1>IRONMAN <span class="broj">70.3</span><small>BELGRADE</small></h1>
  <div class="datum">12.09.2027. <span>· Ada Ciganlija</span></div>
  <div class="discipline">
    <div><b>1,9 km</b><span>plivanje</span></div>
    <div><b>90 km</b><span>bicikl</span></div>
    <div><b>21,1 km</b><span>trčanje</span></div>
  </div>
</div>
</body></html>
